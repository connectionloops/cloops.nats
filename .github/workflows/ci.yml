name: CI

on:
  push:
    branches:
      - main

# Runs are serialized so two quick merges cannot compute the same version (see "Calculate package version").
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: sdk/cloops.nats.sdk.csproj
  BUILD_CONFIGURATION: Release
  MAJOR: 2
  MINOR: 0

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.PACKAGE_VERSION }}
    # A hung consumer-discovery test would otherwise burn the 6h default job limit instead of going red.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      # PATCH = highest existing v{MAJOR}.{MINOR}.* tag + 1, or 0 for a new MAJOR.MINOR line,
      # so bumping MAJOR or MINOR starts at .0 (2.0.0, 2.0.1, ...). Up to 1.4 the patch was the
      # workflow run number, which never resets.
      - name: Calculate package version
        id: version
        run: |
          PREFIX="${{ env.MAJOR }}.${{ env.MINOR }}"
          LAST=$(git ls-remote --tags --refs origin "refs/tags/v${PREFIX}.*" \
            | sed -E "s|.*refs/tags/v${PREFIX//./\\.}\.||" \
            | grep -E '^[0-9]+$' | sort -n | tail -1)
          if [ -z "$LAST" ]; then PATCH=0; else PATCH=$((LAST + 1)); fi
          VERSION="${PREFIX}.${PATCH}"
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build project
        run: dotnet build ${{ env.PROJECT }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore -p:Version=${{ steps.version.outputs.PACKAGE_VERSION }}

      # JetStream server for the integration tests (JetStreamIntegrationTests); they are skipped when NATS_TEST_URL is unset.
      - name: Start NATS server with JetStream
        run: |
          docker run -d --name nats-it -p 14333:4222 -p 18222:8222 nats:2.11.7-alpine -js -m 8222
          curl --silent --show-error --fail --retry 15 --retry-delay 1 --retry-connrefused "http://127.0.0.1:18222/healthz?js-enabled-only=true"

      - name: Run tests
        env:
          NATS_TEST_URL: nats://127.0.0.1:14333
        run: dotnet test tests/cloops.nats.sdk.Tests/cloops.nats.sdk.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --verbosity normal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: "**/TestResults/**/*"
          if-no-files-found: ignore

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Must match the Trusted Publishing policy on nuget.org (repo, workflow file, environment).
    environment: production
    permissions:
      contents: write
      packages: write
      # Required to mint the OIDC token that NuGet/login exchanges for a short-lived API key.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      # Reuse the build job's version so build, package, tag and release always agree.
      - name: Use package version from build
        id: version
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          if [ -z "$VERSION" ]; then echo "Build job did not report a version" >&2; exit 1; fi
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build project
        run: dotnet build ${{ env.PROJECT }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore -p:Version=${{ steps.version.outputs.PACKAGE_VERSION }}

      - name: Pack NuGet package
        run: dotnet pack ${{ env.PROJECT }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --output ./artifacts -p:Version=${{ steps.version.outputs.PACKAGE_VERSION }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: nuget-packages
          path: ./artifacts/**/*.nupkg

      # Trusted Publishing: exchange this run's OIDC token for a short-lived NuGet API key.
      # No stored NUGET_API_KEY secret, nothing to expire or rotate.
      - name: NuGet login (Trusted Publishing)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: gskalele

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/**/*.nupkg --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Tag
        uses: actions/github-script@v8
        with:
          script: |
            const version = '${{ steps.version.outputs.PACKAGE_VERSION }}';
            const tag = `v${version}`;

            // Check if tag already exists
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`
              });
              console.log(`Tag ${tag} already exists, skipping creation.`);
            } catch (error) {
              if (error.status === 404) {
                // Tag doesn't exist, create it
                const sha = context.sha;
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/tags/${tag}`,
                  sha: sha
                });
                console.log(`Created tag ${tag} at ${sha}`);
              } else {
                throw error;
              }
            }

      - name: Create GitHub Release
        uses: actions/github-script@v8
        with:
          script: |
            const version = '${{ steps.version.outputs.PACKAGE_VERSION }}';
            const tag = `v${version}`;

            // Check if release already exists
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              console.log(`Release for tag ${tag} already exists, skipping creation.`);
            } catch (error) {
              if (error.status === 404) {
                // Release doesn't exist, create it
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  name: `Release ${tag}`,
                  body: `## Release ${tag}\n\n- Version: ${version}\n- Build Number: ${{ github.run_number }}\n- Commit: ${{ github.sha }}\n\nAutomated release created by CI pipeline.`,
                  draft: false,
                  prerelease: false
                });
                console.log(`Created release for tag ${tag}`);
              } else {
                throw error;
              }
            }
